[package]
name = "dotara-ui"
version = "0.1.0"
edition = "2021"
description = "Dotara media player UI (Leptos, compiled to WebAssembly)"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Element", "DomRect", "HtmlDivElement"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[workspace]
members = ["src-tauri"]
resolver = "2"
